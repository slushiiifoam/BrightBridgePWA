[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Specify the JS runtime directory explicitly
[functions]
  directory = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200